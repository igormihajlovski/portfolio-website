media:
  - name: images
    label: Images
    input: images
    output: /images
    categories:
      - image
    rename: safe
components:
  translation_id:
    label: Translation ID
    type: string
    required: true
    description: >-
      Stable internal identifier. Use the same value across translations and do not change it after
      creation or publication.
    pattern:
      regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      message: Use lowercase letters, numbers, and single hyphens only.
    options:
      minlength: 3
      maxlength: 120
  content_slug:
    label: Slug
    type: string
    required: true
    pattern:
      regex: ^[a-z0-9-]+$
      message: Use lowercase letters, numbers, and hyphens only.
    options:
      minlength: 3
      maxlength: 100
  published_date:
    label: Published Date
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  publication_status:
    type: select
    label: Publication Status
    required: true
    default: Draft
    description: >-
      Controls production publication. Draft creates no route and is excluded from listings,
      sitemap, counterparts, and RSS.
    options:
      values:
        - Draft
        - Published
  project_title:
    label: Project Title
    type: string
    required: true
  project_category:
    label: Category
    type: select
    required: true
    options:
      values:
        - Case Study
        - Webflow
        - CRM Integration
        - Automation
        - Development
        - SEO
        - Tutorial
  project_newsletter_published_at:
    label: Newsletter Published At
    type: date
    required: false
    default: ''
    description: >-
      Leave empty to exclude this Project from newsletter/RSS updates. Set once only when this
      Project is ready to be announced to subscribers.
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm:ssXXX
  project_project_status:
    label: Project Status (Lifecycle)
    type: select
    required: true
    default: Completed
    options:
      values:
        - Completed
        - In Progress
        - Maintenance
    description: Describes the project lifecycle only. It does not control publication.
  project_featured_project:
    label: Featured Project
    type: boolean
    default: false
  project_show_on_homepage:
    label: Show on Homepage
    type: boolean
    default: false
    description: Show this project in the featured section on the homepage.
  project_short_description:
    label: Short Description
    type: text
    required: true
    description: Used on the homepage and Projects listing.
    options:
      maxlength: 300
  project_hero:
    label: 1. Hero
    type: object
    required: true
    fields:
      - name: subtitle
        label: Short Subtitle
        type: text
        required: true
        options:
          maxlength: 240
      - name: featured_image
        label: Featured Image
        type: image
        required: true
        options:
          media: images
          path: blog
          rename: safe
      - name: services
        label: Services
        type: string
        list: true
        required: true
      - name: technologies
        label: Technologies
        type: string
        list: true
        required: true
  project_project_information:
    label: 2. Project Information
    type: object
    required: true
    fields:
      - name: client
        label: Client
        type: string
        required: true
      - name: industry
        label: Industry
        type: string
        required: true
      - name: country
        label: Country
        type: string
        required: true
      - name: business_type
        label: Business Type
        type: string
        required: true
      - name: platform
        label: Platform
        type: string
        required: true
      - name: cms
        label: CMS
        type: string
        required: false
      - name: duration
        label: Duration
        type: string
        required: false
      - name: website
        label: Website
        type: string
        required: false
  project_project_overview:
    label: 3. Project Overview
    type: rich-text
    required: true
    options:
      format: markdown
      media: images
      path: blog
      rename: safe
      switcher: true
  project_challenge:
    label: 4. Challenge
    type: rich-text
    required: true
    options:
      format: markdown
      media: images
      path: blog
      rename: safe
      switcher: true
  project_goals:
    label: 5. Goals
    type: string
    list: true
    required: true
  project_my_role:
    label: 6. My Role
    type: object
    required: true
    fields:
      - name: roles
        label: Roles
        type: string
        list: true
        required: true
      - name: responsibilities
        label: Responsibilities
        type: string
        list: true
        required: true
  project_my_approach:
    label: 7. My Approach
    type: rich-text
    required: true
    options:
      format: markdown
      media: images
      path: blog
      rename: safe
      switcher: true
  project_design_process:
    label: 8. Design Process
    type: rich-text
    required: true
    options:
      format: markdown
      media: images
      path: blog
      rename: safe
      switcher: true
  project_development_process:
    label: 9. Development Process
    type: rich-text
    required: true
    options:
      format: markdown
      media: images
      path: blog
      rename: safe
      switcher: true
  project_tech_stack:
    label: 10. Tech Stack
    type: object
    required: true
    fields:
      - name: development
        label: Development
        type: string
        list: true
      - name: cms
        label: CMS
        type: string
        list: true
      - name: libraries
        label: Libraries
        type: string
        list: true
      - name: integrations
        label: Integrations
        type: string
        list: true
      - name: tools
        label: Tools
        type: string
        list: true
  project_third_party_integrations:
    label: 11. Third-Party Integrations
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name} ({index})'
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: purpose
        label: Purpose
        type: text
        required: true
      - name: website
        label: Website
        type: string
        required: false
  project_key_features:
    label: 12. Key Features
    type: string
    list: true
    required: true
  project_deliverables:
    label: 13. Deliverables
    type: string
    list: true
    required: true
  project_results:
    label: 14. Results
    type: rich-text
    required: true
    options:
      format: markdown
      media: images
      path: blog
      rename: safe
      switcher: true
  project_lessons_learned:
    label: 15. Lessons Learned
    type: rich-text
    required: true
    options:
      format: markdown
      media: images
      path: blog
      rename: safe
      switcher: true
  project_gallery:
    label: 16. Project Gallery
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title} ({index})'
    fields:
      - name: title
        label: Image Title
        type: string
        required: true
      - name: image
        label: Image
        type: image
        required: true
        options:
          media: images
          path: blog
          rename: safe
      - name: alt
        label: Alt Text
        type: string
        required: true
      - name: caption
        label: Caption
        type: text
        required: false
  project_project_links:
    label: 17. Project Links
    type: object
    fields:
      - name: live_url
        label: Live Project URL
        type: string
        required: false
      - name: live_button_text
        label: Live Project Button Text
        type: string
        required: false
        description: Optional localized label. Leave empty to use the locale-aware shared UI label.
      - name: github_url
        label: GitHub URL
        type: string
        required: false
      - name: github_button_text
        label: GitHub Button Text
        type: string
        required: false
        description: Optional localized label. Leave empty to use the locale-aware shared UI label.
      - name: demo_url
        label: Demo URL
        type: string
        required: false
      - name: demo_button_text
        label: Demo Button Text
        type: string
        required: false
        description: Optional localized label. Leave empty to use the locale-aware shared UI label.
  project_seo:
    label: 18. SEO
    type: object
    required: true
    fields:
      - name: title
        label: SEO Title
        type: string
        required: true
        options:
          maxlength: 60
      - name: description
        label: SEO Description
        type: text
        required: true
        options:
          maxlength: 160
      - name: og_image
        label: Open Graph Image
        type: image
        required: false
        options:
          media: images
          path: blog
          rename: safe
  blog_title:
    label: Title
    type: string
    required: true
  blog_featured:
    label: Featured
    type: boolean
    default: false
  blog_category:
    label: Category
    type: string
    required: true
  blog_tags:
    label: Tags
    type: string
    list: true
    required: false
  blog_short_description:
    label: Short Description / Excerpt
    type: text
    required: true
    description: A concise summary used on Blog cards and as the SEO description fallback.
    options:
      maxlength: 300
  blog_featured_image:
    label: Featured Image
    type: image
    required: false
    options:
      media: images
      path: blog
      rename: safe
  blog_featured_image_alt:
    label: Featured Image Alt Text
    type: string
    required: false
    description: Describe the image for accessibility. The article title is used as a fallback.
  blog_author:
    label: Author
    type: string
    required: true
    default: Igor Mihajlovski
  blog_article_content:
    label: Article Content
    type: rich-text
    required: true
    options:
      format: markdown
      media: images
      path: blog
      rename: safe
      switcher: true
  blog_related_project_label:
    label: Related Project Label
    type: string
    required: false
  blog_related_project_url:
    label: Related Project URL
    type: string
    required: false
    description: Optional URL for a relevant Case Study, such as /projects/example/.
  blog_seo:
    label: SEO
    type: object
    required: false
    fields:
      - name: title
        label: SEO Title
        type: string
        required: false
        options:
          maxlength: 60
      - name: description
        label: SEO Description
        type: text
        required: false
        options:
          maxlength: 160
      - name: og_image
        label: Open Graph Image
        type: image
        required: false
        options:
          media: images
          path: blog
          rename: safe
  blog_related_project_translation_id:
    type: string
    label: Related Project Translation ID
    required: false
    description: >-
      Optional stable Project translation ID for future locale-aware counterpart resolution. This
      does not replace existing visible links yet.
    pattern:
      regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      message: Use lowercase letters, numbers, and single hyphens only.
    options:
      minlength: 3
      maxlength: 120
