media:
  - name: images
    label: Images
    input: images
    output: /images
    categories: [image]
    rename: safe

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: yaml-frontmatter
    filename: "{slug}.md"

    view:
      fields: [title, category, published_date, show_on_homepage]
      primary: title
      sort: [published_date, title]
      search: [title, category, short_description]
      default:
        sort: published_date
        order: desc

    fields:
      # =========================
      # General
      # =========================

      - name: title
        label: Project Title
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use lowercase letters, numbers, and hyphens only."
        options:
          minlength: 3
          maxlength: 100

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Case Study
            - Webflow
            - CRM Integration
            - Automation
            - Development
            - SEO
            - Tutorial

      - name: published_date
        label: Published Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: project_status
        label: Project Status
        type: select
        required: true
        default: Completed
        options:
          values:
            - Completed
            - In Progress
            - Maintenance

      - name: featured_project
        label: Featured Project
        type: boolean
        default: false

      - name: show_on_homepage
        label: Show on Homepage
        type: boolean
        default: false
        description: "Show this project in the featured section on the homepage."

      - name: short_description
        label: Short Description
        type: text
        required: true
        description: "Used on the homepage and Projects listing."
        options:
          maxlength: 300

      # =========================
      # 1. Hero
      # =========================

      - name: hero
        label: 1. Hero
        type: object
        required: true
        fields:
          - name: subtitle
            label: Short Subtitle
            type: text
            required: true
            options:
              maxlength: 240

          - name: featured_image
            label: Featured Image
            type: image
            required: true
            options:
              media: images
              path: blog
              rename: safe

          - name: services
            label: Services
            type: string
            list: true
            required: true

          - name: technologies
            label: Technologies
            type: string
            list: true
            required: true

      # =========================
      # 2. Project Information
      # =========================

      - name: project_information
        label: 2. Project Information
        type: object
        required: true
        fields:
          - name: client
            label: Client
            type: string
            required: true

          - name: industry
            label: Industry
            type: string
            required: true

          - name: country
            label: Country
            type: string
            required: true

          - name: business_type
            label: Business Type
            type: string
            required: true

          - name: platform
            label: Platform
            type: string
            required: true

          - name: cms
            label: CMS
            type: string
            required: false

          - name: duration
            label: Duration
            type: string
            required: false

          - name: website
            label: Website
            type: string
            required: false

      # =========================
      # 3. Project Overview
      # =========================

      - name: project_overview
        label: 3. Project Overview
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          path: blog
          rename: safe
          switcher: true

      # =========================
      # 4. Challenge
      # =========================

      - name: challenge
        label: 4. Challenge
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          path: blog
          rename: safe
          switcher: true

      # =========================
      # 5. Goals
      # =========================

      - name: goals
        label: 5. Goals
        type: string
        list: true
        required: true

      # =========================
      # 6. My Role
      # =========================

      - name: my_role
        label: 6. My Role
        type: object
        required: true
        fields:
          - name: roles
            label: Roles
            type: string
            list: true
            required: true

          - name: responsibilities
            label: Responsibilities
            type: string
            list: true
            required: true

      # =========================
      # 7. My Approach
      # =========================

      - name: my_approach
        label: 7. My Approach
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          path: blog
          rename: safe
          switcher: true

      # =========================
      # 8. Design Process
      # =========================

      - name: design_process
        label: 8. Design Process
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          path: blog
          rename: safe
          switcher: true

      # =========================
      # 9. Development Process
      # =========================

      - name: development_process
        label: 9. Development Process
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          path: blog
          rename: safe
          switcher: true

      # =========================
      # 10. Tech Stack
      # =========================

      - name: tech_stack
        label: 10. Tech Stack
        type: object
        required: true
        fields:
          - name: development
            label: Development
            type: string
            list: true

          - name: cms
            label: CMS
            type: string
            list: true

          - name: libraries
            label: Libraries
            type: string
            list: true

          - name: integrations
            label: Integrations
            type: string
            list: true

          - name: tools
            label: Tools
            type: string
            list: true

      # =========================
      # 11. Third-Party Integrations
      # =========================

      - name: third_party_integrations
        label: 11. Third-Party Integrations
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} ({index})"
        fields:
          - name: name
            label: Name
            type: string
            required: true

          - name: purpose
            label: Purpose
            type: text
            required: true

          - name: website
            label: Website
            type: string
            required: false

      # =========================
      # 12. Key Features
      # =========================

      - name: key_features
        label: 12. Key Features
        type: string
        list: true
        required: true

      # =========================
      # 13. Deliverables
      # =========================

      - name: deliverables
        label: 13. Deliverables
        type: string
        list: true
        required: true

      # =========================
      # 14. Results
      # =========================

      - name: results
        label: 14. Results
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          path: blog
          rename: safe
          switcher: true

      # =========================
      # 15. Lessons Learned
      # =========================

      - name: lessons_learned
        label: 15. Lessons Learned
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          path: blog
          rename: safe
          switcher: true

      # =========================
      # 16. Project Gallery
      # =========================

      - name: gallery
        label: 16. Project Gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} ({index})"
        fields:
          - name: title
            label: Image Title
            type: string
            required: true

          - name: image
            label: Image
            type: image
            required: true
            options:
              media: images
              path: blog
              rename: safe

          - name: alt
            label: Alt Text
            type: string
            required: true

          - name: caption
            label: Caption
            type: text
            required: false

      # =========================
      # 17. Project Links
      # =========================

      - name: project_links
        label: 17. Project Links
        type: object
        fields:
          - name: live_url
            label: Live Project URL
            type: string
            required: false

          - name: live_button_text
            label: Live Project Button Text
            type: string
            required: false
            default: "View Project"

          - name: github_url
            label: GitHub URL
            type: string
            required: false

          - name: github_button_text
            label: GitHub Button Text
            type: string
            required: false
            default: "View Source Code"

          - name: demo_url
            label: Demo URL
            type: string
            required: false

          - name: demo_button_text
            label: Demo Button Text
            type: string
            required: false
            default: "View Demo"

      # =========================
      # 18. SEO
      # =========================

      - name: seo
        label: 18. SEO
        type: object
        required: true
        fields:
          - name: title
            label: SEO Title
            type: string
            required: true
            options:
              maxlength: 60

          - name: description
            label: SEO Description
            type: text
            required: true
            options:
              maxlength: 160

          - name: og_image
            label: Open Graph Image
            type: image
            required: false
            options:
              media: images
              path: blog
              rename: safe
