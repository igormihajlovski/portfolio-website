media:
  - name: images
    label: Images
    input: images
    output: /images
    categories: [image]
    rename: safe

content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{slug}.md"

    view:
      fields: [title, category, published_date, show_on_homepage]
      primary: title
      sort: [published_date, title]
      search: [title, category, short_description]
      default:
        sort: published_date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "Use lowercase letters, numbers, and hyphens only."

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Case Study
            - Webflow
            - CRM Integration
            - Automation
            - Development
            - SEO
            - Tutorial

      - name: short_description
        label: Short Description
        type: text
        required: true
        options:
          maxlength: 300

      - name: featured_image
        label: Featured Image
        type: image
        required: true
        options:
          media: images
          path: blog
          rename: safe

      - name: published_date
        label: Published Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: show_on_homepage
        label: Show on Homepage
        type: boolean
        default: false
        description: "Show this post in the featured section on the homepage."

      - name: project_url
        label: Project URL
        type: string
        required: false
        description: "Leave empty if this post does not have a live project."

      - name: github_url
        label: GitHub URL
        type: string
        required: false
        description: "Leave empty if the source code is not public."

      - name: seo_title
        label: SEO Title
        type: string
        required: true
        options:
          maxlength: 60

      - name: seo_description
        label: SEO Description
        type: text
        required: true
        options:
          maxlength: 160

      - name: og_image
        label: Open Graph Image
        type: image
        required: false
        options:
          media: images
          path: blog
          rename: safe

      - name: body
        label: Content
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          path: blog
          rename: safe
          switcher: true
